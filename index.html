<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script defer="defer" src="main.js"></script></head><body><div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div><div class="container"><div class="header-row"><div class="search-box"><i class="fa-solid fa-magnifying-glass search-icon"></i> <input id="cityInput" placeholder="Search for a city..." value="ghaziabad"/> <button id="searchBtn">Go</button></div><div class="unit-toggle"><span class="unit-label">°C</span> <label class="switch"><input type="checkbox" id="unitSwitch"> <span class="slider round"></span></label> <span class="unit-label">°F</span></div></div><div class="loading" id="loading"><div class="spinner"></div><p>Fetching forecast...</p></div><div class="error" id="error"></div><div class="weather-info" id="weatherInfo"><div class="main-weather"><div><h1 class="city-name" id="cityName">-</h1><p class="date" id="date"><i class="fa-regular fa-calendar"></i> <span>-</span></p></div><div class="temp-wrapper"><div class="weather-icon-display"><i id="mainIcon" class="fa-solid fa-sun"></i></div><div class="temperature" id="temperature">-°</div><div class="temp-details"><div class="condition" id="condition">-</div><div class="high-low"><span id="maxTemp"><i class="fa-solid fa-arrow-up"></i> -°</span> <span id="minTemp"><i class="fa-solid fa-arrow-down"></i> -°</span></div></div></div></div><div class="description"><i class="fa-solid fa-quote-left quote-icon"></i> <span id="description">-</span></div><div class="details-grid"><div class="detail-card"><div class="detail-head"><span class="detail-label">Feels Like</span> <i class="fa-solid fa-temperature-half icon-highlight"></i></div><div class="detail-value" id="feelsLike">-°</div></div><div class="detail-card"><div class="detail-head"><span class="detail-label">Humidity</span> <i class="fa-solid fa-droplet icon-blue"></i></div><div class="detail-value" id="humidity">-%</div></div><div class="detail-card"><div class="detail-head"><span class="detail-label">AQI (US)</span> <i class="fa-solid fa-wind icon-gray"></i></div><div class="detail-value" id="aqi">-</div></div><div class="detail-card"><div class="detail-head"><span class="detail-label">UV Index</span> <i class="fa-solid fa-sun icon-orange"></i></div><div class="detail-value" id="uvIndex">-</div></div></div><div class="chart-container"><h3><i class="fa-solid fa-chart-line"></i> 7-Day Forecast</h3><canvas id="forecastChart"></canvas></div></div></div><script type="module" src="index.js"></script></body></html>
