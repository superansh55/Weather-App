<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="container">
      <div class="search-box">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name..."
          value="ghaziabad"
        />
        <button id="searchBtn">Search</button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading weather data...</p>
      </div>

      <div class="error" id="error"></div>

      <div class="weather-info" id="weatherInfo">
        <h1 class="city-name" id="cityName">-</h1>
        <p class="date" id="date">-</p>

        <div class="main-temp">
          <div class="temperature" id="temperature">-°F</div>
          <div class="condition" id="condition">-</div>
        </div>

        <div class="description" id="description">-</div>

        <div class="details-grid">
          <div class="detail-card">
            <div class="detail-label">Feels Like</div>
            <div class="detail-value" id="feelsLike">-°F</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Humidity</div>
            <div class="detail-value" id="humidity">-%</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Max Temp</div>
            <div class="detail-value" id="maxTemp">-°F</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Min Temp</div>
            <div class="detail-value" id="minTemp">-°F</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
